<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MESI Protocol Visualizer</title><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;color:#172b42;background:white;margin:0;padding:18px}main{max-width:850px;margin:auto;border:1px solid #cbd5e1;border-radius:12px;padding:20px}h1{font-size:23px;margin:0 0 8px}h2{font-size:20px;margin:12px 0}svg{width:100%;max-height:340px;display:block}button{font:inherit;padding:10px 18px;border:1px solid #2268ab;background:#2268ab;color:white;border-radius:6px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #e9a522;outline-offset:3px}.controls{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}p{line-height:1.5}.step{color:#475569;font-size:14px}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}.legend b{display:inline-block;color:white;padding:3px 7px;border-radius:4px;margin-right:4px}#desc{min-height:72px}text{font-family:system-ui,sans-serif}</style></head><body><main><h1>MESI Protocol Step-by-Step Visualizer</h1><div class="step" id="step"></div><h2 id="heading"></h2><svg viewBox="0 0 640 290" role="img" aria-labelledby="svgtitle"><title id="svgtitle">Cache coherence state</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#b65b00"/></marker></defs><g fill="#2268ab"><rect x="25" y="10" width="240" height="42" rx="5"/><rect x="375" y="10" width="240" height="42" rx="5"/></g><g fill="white" text-anchor="middle" font-weight="bold" font-size="17"><text x="145" y="37">Core A</text><text x="495" y="37">Core B</text></g><g fill="#ffdf94" stroke="#b79527"><rect x="25" y="65" width="240" height="108" rx="5"/><rect x="375" y="65" width="240" height="108" rx="5"/></g><g text-anchor="middle" fill="#44330d" font-size="13"><text x="145" y="84">Private Cache</text><text x="495" y="84">Private Cache</text></g><rect id="aBox" x="40" y="94" width="210" height="65" rx="5"/><rect id="bBox" x="390" y="94" width="210" height="65" rx="5"/><g fill="white" text-anchor="middle" font-size="17" font-weight="bold"><text id="aVal" x="145" y="120"/><text id="bVal" x="495" y="120"/></g><g fill="white" text-anchor="middle" font-size="14"><text id="aState" x="145" y="143"/><text id="bState" x="495" y="143"/></g><path d="M145 173 V212 H495 V173 M320 212 V236" stroke="#94a3b8" stroke-width="2" fill="none"/><path id="flow" stroke="#b65b00" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text id="action" x="320" y="195" text-anchor="middle" font-size="13" fill="#994c00" font-weight="bold"/><rect x="185" y="237" width="270" height="45" rx="5" fill="#ffda65" stroke="#b79527"/><g text-anchor="middle" fill="#44330d"><text x="320" y="254" font-size="12">Main Memory (simplified model)</text><text id="mem" x="320" y="273" font-size="16" font-weight="bold"/></g></svg><p id="desc" aria-live="polite"></p><div class="controls"><button id="prev">← Previous</button><button id="reset">Reset</button><button id="next">Next →</button></div><p class="legend"><span><b style="background:#7045ae">M</b>Modified</span><span><b style="background:#2268ab">E</b>Exclusive</span><span><b style="background:#27834f">S</b>Shared</span><span><b style="background:#64748b">I</b>Invalid</span></p><small>Conceptual MESI model; actual transfers may be serviced by other cache levels rather than DRAM.</small></main><script>
const states={M:['Modified','#7045ae'],E:['Exclusive','#2268ab'],S:['Shared','#27834f'],I:['Invalid','#64748b']};
const steps=[
['Initially, neither core has cached X.','I','I','—','—',10,'','','Neither core has accessed the cache line containing X. The initial value is stored in memory.'],
['Core A reads X.','E','I','10','—',10,'Fetch data','M320 236 V212 H145 V175','Core A retrieves the line. Since no other core has a valid copy, its line enters the Exclusive state.'],
['Core B reads X.','S','S','10','10',10,'Share cache line','M250 126 H389','Core B retrieves the same line. Both cores now have valid copies in the Shared state.'],
['Core A writes X = 20.','M','I','20','—',10,'Invalidate B','M250 126 H389','Core A obtains write ownership, invalidates Core B’s copy, and modifies X. Main memory may still contain 10.'],
['Core B reads X again.','S','S','20','20',20,'Supply current data','M250 126 H389','Core B cannot use its invalid copy. Core A supplies the current data. In this simplified MESI model, backing memory is updated and both copies become Shared.'],
['Core B writes X = 30.','I','M','—','30',20,'Invalidate A','M390 126 H251','Core B obtains write ownership and invalidates Core A’s copy. Core B now holds the modified data.']];
let i=0;const el=id=>document.getElementById(id);function render(){const [t,a,b,av,bv,mem,action,flow,desc]=steps[i];el('step').textContent=`Step ${i+1} of ${steps.length}`;el('heading').textContent=t;for(const [p,s,v] of [['a',a,av],['b',b,bv]]){el(p+'Box').setAttribute('fill',states[s][1]);el(p+'Val').textContent='X = '+v;el(p+'State').textContent=states[s][0]+' ('+s+')';}el('mem').textContent='X = '+mem;el('action').textContent=action;el('flow').setAttribute('d',flow);el('desc').textContent=desc;el('svgtitle').textContent=`Core A: ${states[a][0]}, Core B: ${states[b][0]}, memory X = ${mem}`;el('prev').disabled=i===0;el('next').disabled=i===steps.length-1;}el('prev').onclick=()=>{if(i>0)i--;render()};el('next').onclick=()=>{if(i<steps.length-1)i++;render()};el('reset').onclick=()=>{i=0;render()};render();</script></body></html>
