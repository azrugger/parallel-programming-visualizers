<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cache Address Calculator</title><style> *{box-sizing:border-box}body{font:16px system-ui,sans-serif;color:#172b42;background:#fff;margin:0;padding:20px}main{max-width:760px;margin:auto}h1{font-size:24px;margin:0 0 16px}label{display:block;font-weight:600;margin-bottom:6px}input,select{font:inherit;width:100%;padding:10px;border:1px solid #8292a4;border-radius:6px;background:white;color:#172b42}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}.result{display:flex;gap:4px;margin:20px 0}.result>div{padding:15px 5px;text-align:center;border-radius:6px;flex:1}.tag{background:#175b9b;color:white}.set{background:#ffc34d;color:#172b42}.offset{background:#237c50;color:white}.num{display:block;font-size:28px;font-weight:bold}.bits{font-size:13px}p{line-height:1.5}#error{color:#a32121}code{font-size:14px} @media(max-width:420px){body{padding:10px}.grid{gap:8px}.num{font-size:20px}}</style><main><h1>Interactive Cache Address Calculator</h1><label for="address">Memory address (decimal)</label><input id="address" type="number" min="0" max="4294967295" step="1" value="100000"><div class="grid"><div><label for="capacity">Cache capacity</label><select id="capacity"><option value="16">16 KB</option><option value="32" selected>32 KB</option><option value="64">64 KB</option></select></div><div><label for="ways">Associativity</label><select id="ways"><option>1</option><option>2</option><option>4</option><option selected>8</option><option>16</option></select></div></div><p id="config"></p><p id="error" role="alert"></p><section id="output" aria-live="polite"><div class="result"><div class="tag">Tag<span class="num" id="tag"></span><span class="bits" id="tagbits"></span></div><div class="set">Set index<span class="num" id="set"></span><span class="bits" id="setbits"></span></div><div class="offset">Byte offset<span class="num" id="offset"></span><span class="bits">6 bits</span></div></div><p id="explanation"></p><details><summary>Show calculations</summary><p id="math"></p></details></section><p><small>Assumes unsigned 32-bit byte addresses, 64-byte cache lines, and conventional set indexing. KB denotes 1024 bytes.</small></p></main><script>const el=id=>document.getElementById(id);function update(){const raw=el('address').value,a=Number(raw),kb=Number(el('capacity').value),w=Number(el('ways').value),lines=kb*1024/64,sets=lines/w;el('config').textContent=`64-byte cache lines · ${sets} sets · ${lines} cache lines`;const valid=raw!==''&&Number.isInteger(a)&&a>=0&&a<=4294967295;el('error').textContent=valid?'':'Enter an integer from 0 through 4,294,967,295.';el('output').hidden=!valid;if(!valid)return;const block=Math.floor(a/64),s=block%sets,t=Math.floor(block/sets),o=a%64;el('tag').textContent=t;el('set').textContent=s;el('offset').textContent=o;el('tagbits').textContent=`${26-Math.log2(sets)} bits`;el('setbits').textContent=`${Math.log2(sets)} bits`;el('explanation').textContent=`Address ${a.toLocaleString('en-US')} maps to Set ${s} and can occupy ${w===1?'its only way':`any of its ${w} ways`}.`;el('math').textContent=`Block = floor(${a} / 64) = ${block}; Set = ${block} mod ${sets} = ${s}; Tag = floor(${block} / ${sets}) = ${t}; Offset = ${a} mod 64 = ${o}.`;}['address','capacity','ways'].forEach(id=>el(id).addEventListener('input',update));update();</script></html>
