<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Check Your Knowledge — Caching Part I</title><style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#fff;color:#182638}main{max-width:850px;margin:auto;padding:20px}h1{font-size:1.55rem;margin:0 0 4px;color:#174e85}p{margin:8px 0}header{border-bottom:2px solid #d8e3ef;padding-bottom:14px}.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600;margin:12px 0}progress{width:100%;height:12px;accent-color:#2268ab}fieldset{min-width:0;margin:18px 0;padding:12px 16px 16px;border:1px solid #cbd5e1;border-radius:9px}legend{font-weight:650;padding:0 5px;max-width:100%}label{display:flex;align-items:baseline;gap:10px;padding:7px 4px;cursor:pointer}input{accent-color:#2268ab;flex-shrink:0}label:has(input:checked){background:#eaf2fc;border-radius:5px}input:focus-visible,button:focus-visible{outline:3px solid #b56800;outline-offset:3px}.feedback{padding:10px 12px;margin-top:8px;border-left:4px solid;border-radius:3px}.correct{background:#eaf6ed;color:#17552d;border-color:#267642}.incorrect{background:#fff2e6;color:#853800;border-color:#b76113}button{font:inherit;font-weight:600;padding:9px 16px;border:1px solid #2268ab;border-radius:6px;color:#174e85;background:white;cursor:pointer}button:hover{background:#eaf2fc}.note{font-size:.9rem;color:#475569}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}</style></head><body><main><header><h1>Check Your Knowledge</h1><p>Caching Issues in Multicore Performance — Part I</p><p class="note">Choose an answer to receive immediate feedback. You may change your answers or reset the quiz. This is ungraded practice.</p><div class="status" aria-live="polite"><span id="answered"></span><span id="score"></span></div><progress id="progress" aria-label="Questions answered"></progress></header><form id="quiz"></form><footer><button type="button" id="reset">Reset questions</button><span id="result" role="status"></span></footer><p class="note">Answers are not submitted to Canvas or saved.</p></main><script>
const questions=[["Why does a processor retrieve an entire cache line rather than just the requested variable?", ["To take advantage of temporal locality only", "To take advantage of spatial locality", "To increase the size of main memory"], 1, "Nearby data may be accessed soon, so fetching it together reduces the need for additional expensive memory transfers."], ["Which inner loop generally provides better spatial locality for a C++ array A[row][col]?", ["Incrementing row", "Incrementing col", "Both are always identical"], 1, "C++ built-in multidimensional arrays are stored in row-major order. Consecutive column indices correspond to adjacent memory addresses."], ["Why might adding more cores stop improving the performance of an array summation?", ["The parallel fraction necessarily becomes smaller", "The size of each register decreases", "The available memory bandwidth becomes saturated"], 2, "Once the memory subsystem is transferring data as quickly as it can, more cores may simply compete for the same limited bandwidth."], ["Why does transposing matrix B potentially improve matrix multiplication performance?", ["It reduces the number of multiplications", "It allows both input matrices to be accessed sequentially during each dot product", "It reduces the computational complexity to O(N²)"], 1, "Transposing B converts the original column accesses into contiguous row accesses without changing the number of arithmetic operations."], ["Can two threads modifying different variables still incur cache coherence overhead?", ["Yes, if the variables occupy the same cache line", "No, because the variables have different addresses", "Only if the threads have a race condition"], 0, "Cache coherence operates at the cache line level. Independent variables sharing a cache line can cause false sharing."]];
const answers=Array(questions.length).fill(null);
const form=document.getElementById('quiz');
questions.forEach(([question,options,correct,explanation],i)=>{const field=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=`${i+1}. ${question}`;field.append(legend);options.forEach((option,j)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name=`q${i}`;input.value=j;input.addEventListener('change',()=>{answers[i]=j;const ok=j===correct;feedback.className='feedback '+(ok?'correct':'incorrect');feedback.hidden=false;feedback.replaceChildren();const heading=document.createElement('strong');heading.textContent=ok?'Correct! ':'Not quite. ';feedback.append(heading,document.createTextNode(explanation));update();});label.append(input,document.createTextNode(option));field.append(label);});const feedback=document.createElement('div');feedback.id=`feedback${i}`;feedback.className='feedback';feedback.setAttribute('role','status');feedback.hidden=true;field.append(feedback);form.append(field);});
function update(){const n=answers.filter(a=>a!==null).length;const score=answers.filter((a,i)=>a===questions[i][2]).length;document.getElementById('answered').textContent=`${n} of ${questions.length} answered`;document.getElementById('score').textContent=`Score: ${score} / ${questions.length}`;const progress=document.getElementById('progress');progress.max=questions.length;progress.value=n;document.getElementById('result').textContent=n===questions.length?`Complete! ${score} of ${questions.length} correct.`:'';}
form.addEventListener('submit',e=>e.preventDefault());document.getElementById('reset').addEventListener('click',()=>{form.reset();answers.fill(null);form.querySelectorAll('.feedback').forEach(f=>{f.hidden=true;f.textContent='';});update();});update();
</script></body></html>
